<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZeNode · Admin</title>
    <style>
      :root {
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #eef1f6;
        background: #17191f;
      }
      * { box-sizing: border-box; }
      body { min-height:100vh; margin:0; display:grid; place-items:center; padding:24px; }
      main {
        width:min(420px,100%);
        padding:28px;
        border:1px solid #363a45;
        border-radius:12px;
        background:#20232b;
        box-shadow:0 18px 50px rgba(0,0,0,.28);
      }
      h1 { margin:0 0 8px; font-size:22px; }
      p { margin:0 0 22px; color:#aeb4c0; line-height:1.45; }
      button {
        width:100%;
        min-height:42px;
        border:1px solid #565d6c;
        border-radius:8px;
        background:#2d323d;
        color:#fff;
        font:inherit;
        font-weight:700;
        cursor:pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>ZeNode · Admin</h1>
      <p>Activa el modo admin sólo para esta sesión del navegador.</p>
      <button id="enter-admin" type="button">Entrar como admin</button>
    </main>
    <script>
      document.getElementById('enter-admin').addEventListener('click', () => {
        sessionStorage.setItem('zenode:admin', 'true');
        window.location.replace('/');
      });
    </script>
  </body>
</html>
